<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Turbo fidelity: NTSC 30000/1001 (typography + SVG)</title>
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d1321; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0d1321; color: #f0ebd8; }
      .title { position: absolute; top: 140px; left: 0; width: 100%; text-align: center; font: 700 120px Georgia, serif; letter-spacing: 4px; }
      .title span { display: inline-block; }
      .sub { position: absolute; top: 320px; left: 0; width: 100%; text-align: center; font: 400 44px "Segoe UI", Arial, sans-serif; color: #a9b4c2; }
      .mono { position: absolute; bottom: 90px; left: 120px; font: 500 36px Consolas, "Courier New", monospace; color: #7d98a1; font-variant-numeric: tabular-nums; }
      .para { position: absolute; top: 460px; left: 980px; width: 820px; font: 400 30px/1.5 Georgia, serif; color: #cfd8dc; }
      svg { position: absolute; top: 420px; left: 160px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="fps-ntsc-30000-1001" data-width="1920" data-height="1080" data-duration="8">
      <div class="title" id="title"></div>
      <div class="sub" id="sub">Kerning, ligatures (fi fl ffi) and smart quotes at 1080p</div>
      <div class="para" id="para">The quick brown fox jumps over the lazy dog. Sphinx of black quartz, judge my vow. Accents and scripts: Tiếng Việt có dấu, Ελληνικά, Кириллица, 日本語のテキスト.</div>
      <div class="mono" id="counter">00000.000</div>
      <svg width="700" height="520" viewBox="0 0 700 520">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff6b6b" /><stop offset="1" stop-color="#4ecdc4" />
          </linearGradient>
        </defs>
        <path id="wave" d="M20 260 C 120 60, 240 60, 340 260 S 560 460, 680 260" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" />
        <g id="star" transform="translate(350 260)">
          <polygon points="0,-110 26,-34 106,-34 42,14 66,92 0,46 -66,92 -42,14 -106,-34 -26,-34" fill="url(#g)" opacity="0.85" />
        </g>
        <circle id="dot" cx="20" cy="260" r="18" fill="#f0ebd8" />
      </svg>
    </div>
    <script>
      const title = document.getElementById("title");
      for (const ch of "HyperFrames Turbo") {
        const s = document.createElement("span");
        s.textContent = ch === " " ? " " : ch;
        title.appendChild(s);
      }
      const wave = document.getElementById("wave");
      const len = wave.getTotalLength();
      wave.style.strokeDasharray = len;
      wave.style.strokeDashoffset = len;
      const counter = { v: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.from("#title span", { y: 80, opacity: 0, duration: 0.6, stagger: 0.05, ease: "back.out(2)" }, 0);
      tl.from("#sub", { opacity: 0, y: 20, duration: 0.8 }, 0.8);
      tl.from("#para", { opacity: 0, x: 60, duration: 1.0 }, 1.2);
      tl.to(wave, { strokeDashoffset: 0, duration: 3, ease: "power1.inOut" }, 0.5);
      tl.to("#star", { rotation: 360, svgOrigin: "350 260", duration: 6, ease: "none" }, 1);
      tl.to("#dot", { attr: { cx: 680 }, duration: 6, ease: "sine.inOut" }, 1);
      tl.to(counter, {
        v: 12345.678,
        duration: 7,
        ease: "none",
        onUpdate: () => {
          document.getElementById("counter").textContent = counter.v.toFixed(3).padStart(9, "0");
        },
      }, 0);
      tl.to({}, { duration: 8 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["fps-ntsc-30000-1001"] = tl;
    </script>
  </body>
</html>
