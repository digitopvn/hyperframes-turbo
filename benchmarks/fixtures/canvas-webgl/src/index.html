<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Turbo golden: canvas 2D + full-screen WebGL shader</title>
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      canvas { position: absolute; left: 0; top: 0; }
      .label { position: absolute; left: 60px; top: 40px; color: #fff; font: 700 48px Arial, sans-serif; text-shadow: 0 2px 8px #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="canvas-webgl" data-width="1920" data-height="1080" data-duration="6">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <canvas id="c2d" width="1920" height="1080"></canvas>
      <div class="label">WebGL fragment shader + 2D canvas</div>
    </div>
    <script>
      const gl = document.getElementById("gl").getContext("webgl", { preserveDrawingBuffer: true });
      const vs = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fs = [
        "precision highp float; uniform float t; uniform vec2 r;",
        "void main(){ vec2 uv = (gl_FragCoord.xy * 2.0 - r) / r.y; float a = 0.0;",
        "  for (int i = 0; i < 24; i++) { float fi = float(i);",
        "    vec2 c = vec2(sin(t * 0.7 + fi * 1.3), cos(t * 0.5 + fi * 0.9)) * 0.8;",
        "    a += 0.012 / length(uv - c); }",
        "  vec3 col = a * vec3(0.9, 0.5 + 0.5 * sin(t), 1.0);",
        "  col += 0.2 * vec3(sin(uv.x * 8.0 + t), sin(uv.y * 8.0 - t), 0.5);",
        "  gl_FragColor = vec4(col, 1.0); }",
      ].join("\n");
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uT = gl.getUniformLocation(prog, "t");
      gl.uniform2f(gl.getUniformLocation(prog, "r"), 1920, 1080);
      const ctx = document.getElementById("c2d").getContext("2d");
      function draw(t) {
        gl.uniform1f(uT, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        ctx.clearRect(0, 0, 1920, 1080);
        for (let i = 0; i < 60; i++) {
          const x = 960 + Math.cos(t * 1.5 + i * 0.35) * (200 + i * 10);
          const y = 540 + Math.sin(t * 1.1 + i * 0.35) * (120 + i * 6);
          ctx.fillStyle = `hsla(${(i * 6 + t * 60) % 360}, 90%, 60%, 0.8)`;
          ctx.beginPath();
          ctx.arc(x, y, 14, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Drawing is driven by the seeked timeline time, so every frame is deterministic.
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 6, duration: 6, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["canvas-webgl"] = tl;
    </script>
  </body>
</html>
