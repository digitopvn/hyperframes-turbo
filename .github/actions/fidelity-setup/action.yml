name: fidelity-setup
description: Pinned FFmpeg, Node 24, Bun, Chrome headless shell and an upstream build for the fidelity jobs.
# Actions are pinned by full commit SHA (tag in the trailing comment); a tag can be moved, a SHA cannot.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "24"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - name: Cache FFmpeg, Chrome and Bun downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/fidelity-ffmpeg
          ~/.cache/puppeteer
          ~/.bun/install/cache
        key: fidelity-${{ runner.os }}-${{ env.FFMPEG_SHA256 }}-${{ env.CHROME_HEADLESS_SHELL }}-${{ hashFiles('upstream/hyperframes/bun.lock') }}
    # The tarball itself stays in the cache and is re-verified and re-extracted
    # on every run, so a tampered or corrupted cache entry fails the job
    # instead of supplying an unverified binary.
    - name: Install pinned FFmpeg (sha256-verified on every run)
      shell: bash
      run: |
        set -euo pipefail
        dir="$HOME/.cache/fidelity-ffmpeg"
        tarball="$dir/ffmpeg.tar.xz"
        mkdir -p "$dir"
        if [ ! -f "$tarball" ]; then curl -sSfL -o "$tarball" "$FFMPEG_URL"; fi
        echo "$FFMPEG_SHA256  $tarball" | sha256sum -c -
        rm -rf "$RUNNER_TEMP/ffmpeg-x" "$RUNNER_TEMP/ffmpeg-bin"
        mkdir -p "$RUNNER_TEMP/ffmpeg-x" "$RUNNER_TEMP/ffmpeg-bin"
        tar -xJf "$tarball" -C "$RUNNER_TEMP/ffmpeg-x"
        cp "$RUNNER_TEMP"/ffmpeg-x/ffmpeg-*-static/ffmpeg "$RUNNER_TEMP"/ffmpeg-x/ffmpeg-*-static/ffprobe "$RUNNER_TEMP/ffmpeg-bin/"
        echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -hide_banner -version | head -1
        filters="$("$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -hide_banner -filters)"
        if ! grep -q libvmaf <<<"$filters"; then echo "::error::pinned FFmpeg has no libvmaf"; exit 1; fi
    # CHROME_HEADLESS_SHELL_SHA256 is the sha256 of the chrome-headless-shell
    # binary inside chrome-for-testing-public/<version>/linux64/chrome-headless-shell-linux64.zip.
    # It is checked after install, including on cache hits.
    - name: Install Chrome headless shell (sha256-verified on every run)
      shell: bash
      run: |
        set -euo pipefail
        npx --yes @puppeteer/browsers@2 install "chrome-headless-shell@$CHROME_HEADLESS_SHELL" --path "$HOME/.cache/puppeteer"
        bin="$HOME/.cache/puppeteer/chrome-headless-shell/linux-$CHROME_HEADLESS_SHELL/chrome-headless-shell-linux64/chrome-headless-shell"
        echo "$CHROME_HEADLESS_SHELL_SHA256  $bin" | sha256sum -c -
    - name: Build pinned upstream
      shell: bash
      working-directory: upstream/hyperframes
      run: |
        bun install --frozen-lockfile
        bun run build